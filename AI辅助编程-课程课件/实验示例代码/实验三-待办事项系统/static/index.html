<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>待办事项管理系统 · AI辅助编程</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="app">
    <header class="app__header">
      <h1>待办事项</h1>
      <p class="app__sub">AI辅助编程 · 实验三参考实现</p>
    </header>

    <form id="add-form" class="add">
      <input id="title-input" class="add__input" type="text"
             placeholder="添加一个待办事项，回车确认…" maxlength="200" autocomplete="off" />
      <button class="add__btn" type="submit">添加</button>
    </form>

    <div class="filters" id="filters">
      <button class="filters__btn is-active" data-status="all">全部</button>
      <button class="filters__btn" data-status="active">进行中</button>
      <button class="filters__btn" data-status="completed">已完成</button>
    </div>

    <ul id="list" class="list"></ul>

    <footer class="app__footer">
      <span id="stats">共 0 项</span>
      <button id="clear-done" class="link">清除已完成</button>
    </footer>
    <p id="error" class="error" hidden></p>
  </main>

  <script src="/app.js"></script>
</body>
</html>
